[project]
name = "smm"
version = "0.1.0"
description = "AI Instagram content strategist: a LangGraph pipeline that scrapes a creator and competitors and writes a 20-post script pack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.1.0",
    "langchain-core>=1.5.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "markdown>=3.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "reportlab>=4.0",
    "streamlit>=1.40",
    "xhtml2pdf>=0.2.16",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
